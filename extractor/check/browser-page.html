<!doctype html>
<meta charset="utf-8">
<title>engine check</title>
<script type="module">
  const workers = new Map();
  const waiting = new Map();
  let sequence = 0;

  window.spawn = name => {
    const worker = new Worker('/check/worker.js', { type: 'module' });
    worker.onmessage = ({ data }) => {
      const call = waiting.get(data.id);
      waiting.delete(data.id);
      if (data.ok) call.resolve(data.result); else call.reject(new Error(data.error));
    };
    worker.onerror = event => { throw new Error(`worker ${name}: ${event.message}`); };
    workers.set(name, worker);
  };
  window.call = (name, message) => new Promise((resolve, reject) => {
    const id = ++sequence;
    waiting.set(id, { resolve, reject });
    workers.get(name).postMessage({ id, ...message });
  });
  window.kill = name => {
    workers.get(name)?.terminate();
    workers.delete(name);
  };
  window.ready = true;
</script>
