name: Chest Log Companion release

on:
  push:
    tags: ["companion-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
        working-directory: companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: companion/go.mod
          cache: false

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/companion-v* ]]; then
            version="${GITHUB_REF_NAME#companion-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::Tag $GITHUB_REF_NAME must look like companion-v1.2.3"
              exit 1
            }
          else
            version="0.0.0"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64,arm64 \
            --file-version "$VERSION" --product-version "$VERSION"
          flags="-H=windowsgui -s -w -X main.version=$VERSION"
          GOOS=windows GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags "$flags" -o ChestLogCompanion.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags "$flags" -o ChestLogCompanion-arm64.exe .
          sha256sum ChestLogCompanion.exe ChestLogCompanion-arm64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/companion-v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            companion/ChestLogCompanion.exe
            companion/ChestLogCompanion-arm64.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/companion-v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=(ChestLogCompanion.exe ChestLogCompanion-arm64.exe SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes="Windows tray program that lets Chest Log read your Fortnite replays. Use ChestLogCompanion.exe on most PCs and ChestLogCompanion-arm64.exe on Windows on ARM. The source for this release is the companion folder at the $TAG tag. Check a download with SHA256SUMS.txt and with: gh attestation verify ChestLogCompanion.exe --repo $GH_REPO"
            gh release create "$TAG" "${files[@]}" --verify-tag --title "Chest Log Companion $VERSION" --notes "$notes"
          fi

      - name: Keep the build from a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/companion-v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chest-log-companion
          path: |
            companion/ChestLogCompanion.exe
            companion/ChestLogCompanion-arm64.exe
            companion/SHA256SUMS.txt
